  <rect x="296" y="502" width="52" height="8" rx="4" fill="#0B3D5C" stroke="#C9A227" stroke-width="1.5"/>
  <path d="M304 502 L322 502 L313 484 Z" fill="#C9A227" opacity="0.9"/>
