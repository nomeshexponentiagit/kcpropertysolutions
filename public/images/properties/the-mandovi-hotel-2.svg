  </g>
  <g fill="#C9A227">
    <rect x="20" y="532" width="7" height="24"/><rect x="90" y="532" width="7" height="24"/>
    <rect x="160" y="532" width="7" height="24"/><rect x="230" y="532" width="7" height="24"/>
    <rect x="300" y="532" width="7" height="24"/><rect x="370" y="532" width="7" height="24"/>
    <rect x="440" y="532" width="7" height="24"/><rect x="510" y="532" width="7" height="24"/>
    <rect x="580" y="532" width="7" height="24"/><rect x="650" y="532" width="7" height="24"/>
    <rect x="720" y="532" width="7" height="24"/><rect x="790" y="532" width="7" height="24"/>
  </g>
