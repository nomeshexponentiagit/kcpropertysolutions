<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="mrSky" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#155E8A"/>
      <stop offset="42%" stop-color="#2E9DBF"/>
      <stop offset="66%" stop-color="#E8A25E"/>
      <stop offset="100%" stop-color="#F7C87E"/>
    </linearGradient>
    <linearGradient id="mrWater" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0B3D5C"/>
      <stop offset="100%" stop-color="#06233A"/>
    </linearGradient>
    <linearGradient id="mrGold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E8C766"/>
      <stop offset="55%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8F6F14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mrSky)"/>
  <!-- Sun -->
  <circle cx="620" cy="238" r="52" fill="#F9B93B" opacity="0.95"/>
  <circle cx="620" cy="238" r="92" fill="#F9B93B" opacity="0.25"/>
  <!-- Birds -->
  <g stroke="#0B3D5C" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M180 160 Q190 153 200 160 Q210 153 220 160"/>
    <path d="M225 178 Q235 171 245 178 Q255 171 265 178"/>
  </g>
  <!-- City skyline -->
  <g fill="#0B3D5C">
    <rect x="40" y="380" width="70" height="60"/>
    <rect x="120" y="350" width="40" height="90"/>
    <rect x="120" y="330" width="40" height="20"/>
    <path d="M140 330 L120 330 L120 300 L132 312 L140 300 L140 330 Z"/>
    <rect x="170" y="385" width="80" height="55"/>
    <rect x="260" y="365" width="60" height="75"/>
    <rect x="470" y="370" width="90" height="70"/>
    <rect x="570" y="385" width="70" height="55"/>
    <rect x="650" y="360" width="60" height="80"/>
  </g>
  <!-- Bridge -->
  <rect x="200" y="384" width="360" height="7" fill="#0B3D5C"/>
  <rect x="246" y="334" width="10" height="50" fill="#0B3D5C"/>
  <rect x="504" y="334" width="10" height="50" fill="#0B3D5C"/>
  <g stroke="#C9A227" stroke-width="1.5" opacity="0.7" fill="none">
    <line x1="251" y1="334" x2="200" y2="384"/><line x1="251" y1="334" x2="380" y2="384"/>
    <line x1="509" y1="334" x2="420" y2="384"/><line x1="509" y1="334" x2="560" y2="384"/>
  </g>
  <!-- River -->
  <rect x="0" y="440" width="800" height="120" fill="url(#mrWater)"/>
  <g opacity="0.12" stroke="#C9A227" stroke-width="2" fill="none">
    <path d="M0 460 Q100 450 200 460 T400 460 T600 460 T800 460"/>
    <path d="M0 482 Q100 472 200 482 T400 482 T600 482 T800 482"/>
    <path d="M0 505 Q100 495 200 505 T400 505 T600 505 T800 505"/>
    <path d="M0 528 Q100 518 200 528 T400 528 T600 528 T800 528"/>
