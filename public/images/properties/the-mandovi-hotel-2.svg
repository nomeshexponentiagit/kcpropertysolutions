  <line x1="140" y1="470" x2="140" y2="556" stroke="#6B4A2B" stroke-width="4"/>
  <path d="M68 470 Q140 424 212 470 Z" fill="#E85D5D"/>
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.85" fill="none">
    <path d="M92 468 Q112 452 140 448"/>
    <path d="M140 448 Q168 452 188 468"/>
  </g>
  <ellipse cx="140" cy="558" rx="30" ry="9" fill="url(#mrGold)"/>
  <!-- Parasol table right -->
  <line x1="660" y1="470" x2="660" y2="556" stroke="#6B4A2B" stroke-width="4"/>
  <path d="M588 470 Q660 424 732 470 Z" fill="#2E9DBF"/>
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.85" fill="none">
    <path d="M612 468 Q632 452 660 448"/>
    <path d="M660 448 Q688 452 708 468"/>
  </g>
  <ellipse cx="660" cy="558" rx="30" ry="9" fill="url(#mrGold)"/>
  <!-- Lounge chairs -->
  <g>
    <rect x="390" y="546" width="60" height="12" rx="4" fill="#C9A227"/>
    <rect x="404" y="534" width="32" height="14" rx="3" fill="#E85D5D"/>
    <rect x="460" y="546" width="60" height="12" rx="4" fill="#C9A227"/>
    <rect x="474" y="534" width="32" height="14" rx="3" fill="#E85D5D"/>
  </g>
  <!-- Brass label -->
  <rect x="30" y="30" width="270" height="50" rx="4" fill="#C9A227" opacity="0.9"/>
  <text x="165" y="61" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#06281E">ROOFTOP VIEW</text>
