<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A2E1F"/>
      <stop offset="50%" stop-color="#1F6B3C"/>
      <stop offset="100%" stop-color="#3E8E5A"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4FB8C4"/>
      <stop offset="100%" stop-color="#1E7A96"/>
    </linearGradient>
    <g id="canopyTree">
      <path d="M0 0 L -5 120 L 5 120 Z" fill="#08311F"/>
      <circle cx="0" cy="-26" r="34" fill="#08311F"/>
      <circle cx="-30" cy="-6" r="24" fill="#08311F"/>
      <circle cx="30" cy="-6" r="24" fill="#08311F"/>
      <circle cx="-18" cy="-44" r="22" fill="#0B3D2C"/>
      <circle cx="18" cy="-44" r="22" fill="#0B3D2C"/>
    </g>
    <g id="ecoCot">
      <rect x="-30" y="0" width="60" height="48" rx="4" fill="#0B3D2C"/>
      <path d="M-40 0 L0 -28 L40 0 Q0 6 -40 0 Z" fill="#4CA36B"/>
      <path d="M-40 0 Q0 10 40 0 L40 0 L-40 0 Z" fill="#2E7A4C" opacity="0.6"/>
      <rect x="-9" y="26" width="18" height="22" rx="9" fill="#4CA36B"/>
      <rect x="-24" y="14" width="12" height="12" rx="2" fill="#4CA36B" opacity="0.8"/>
      <rect x="12" y="14" width="12" height="12" rx="2" fill="#4CA36B" opacity="0.8"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- Mountain ridges -->
  <path d="M0 300 L 130 220 L 260 290 L 390 200 L 520 285 L 640 230 L 800 305 L 800 600 L 0 600 Z" fill="#0A2E1F" opacity="0.5"/>
  <path d="M0 350 L 180 285 L 330 345 L 480 275 L 640 340 L 800 290 L 800 600 L 0 600 Z" fill="#0B3D2C" opacity="0.65"/>
  <!-- Forest floor -->
  <path d="M0 410 Q 200 385 400 405 T 800 395 L 800 600 L 0 600 Z" fill="#123F28" opacity="0.8"/>
  <!-- Stream -->
  <path d="M0 500 C 180 470 260 560 460 530 C 620 505 700 485 800 510 L 800 600 L 0 600 Z" fill="url(#water)"/>
  <path d="M0 530 C 200 500 280 580 470 555 C 610 535 700 515 800 535" stroke="#A8E6EA" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Eco cottages nestled in the valley -->
  <use href="#ecoCot" transform="translate(150 398) scale(1.25)"/>
  <use href="#ecoCot" transform="translate(300 408) scale(0.95)"/>
  <use href="#ecoCot" transform="translate(430 392) scale(1.1)"/>
  <use href="#ecoCot" transform="translate(590 402) scale(1.3)"/>
  <use href="#ecoCot" transform="translate(720 410) scale(0.9)"/>
  <!-- Canopy trees framing -->
  <use href="#canopyTree" transform="translate(45 430) scale(1.5)"/>
  <use href="#canopyTree" transform="translate(120 460) scale(1.0)"/>
  <use href="#canopyTree" transform="translate(745 420) scale(1.6)"/>
  <use href="#canopyTree" transform="translate(680 455) scale(0.95)"/>
  <!-- Birds -->
  <path d="M340 120 q 8 -8 16 0 q 8 -8 16 0" stroke="#C9A227" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M385 145 q 6 -6 12 0 q 6 -6 12 0" stroke="#C9A227" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Brass label -->
  <rect x="30" y="520" width="258" height="56" rx="4" fill="#C9A227" opacity="0.92"/>
  <text x="159" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#06281E" letter-spacing="1.5">GREEN VALLEY ECO RESORT</text>
</svg>
