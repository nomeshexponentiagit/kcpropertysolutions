<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="jungle" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B3D2C"/>
      <stop offset="100%" stop-color="#2E7A4C"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#5EC9D2"/>
      <stop offset="100%" stop-color="#1E7A96"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#B98A2F"/>
      <stop offset="100%" stop-color="#8A6420"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#jungle)"/>
  <!-- Jungle backdrop -->
  <path d="M0 200 Q 150 160 300 195 T 600 190 T 800 210 L 800 600 L 0 600 Z" fill="#0A2E1F" opacity="0.55"/>
  <g fill="#08311F" opacity="0.85">
    <circle cx="70" cy="120" r="55"/>
    <circle cx="170" cy="90" r="65"/>
    <circle cx="640" cy="100" r="60"/>
    <circle cx="750" cy="140" r="50"/>
    <circle cx="300" cy="80" r="40"/>
    <circle cx="520" cy="110" r="45"/>
  </g>
  <!-- Natural pool (organic shape) -->
  <path d="M60 340 C 130 300 240 330 300 310 C 380 285 460 315 500 300 C 560 280 620 320 620 370 C 620 430 540 470 460 480 C 360 492 240 470 160 460 C 90 452 30 420 60 340 Z" fill="url(#pool)"/>
  <!-- Pool edge stones -->
  <g fill="#4A3B22" opacity="0.7">
    <ellipse cx="95" cy="352" rx="18" ry="8"/>
    <ellipse cx="160" cy="330" rx="20" ry="8"/>
    <ellipse cx="240" cy="322" rx="16" ry="7"/>
    <ellipse cx="330" cy="316" rx="22" ry="8"/>
    <ellipse cx="420" cy="322" rx="18" ry="7"/>
    <ellipse cx="510" cy="312" rx="20" ry="8"/>
    <ellipse cx="585" cy="330" rx="18" ry="8"/>
  </g>
  <!-- Lily pads -->
  <g fill="#2E7A4C" opacity="0.9">
    <path d="M200 380 l 14 -14 l -4 19 l -10 4 Z"/>
    <ellipse cx="330" cy="420" rx="16" ry="9"/>
    <ellipse cx="420" cy="390" rx="13" ry="7"/>
    <ellipse cx="500" cy="440" rx="15" ry="8"/>
  </g>
  <circle cx="330" cy="420" r="4" fill="#E8C56A"/>
  <circle cx="420" cy="390" r="3" fill="#E8C56A"/>
  <!-- Wooden deck -->
  <rect x="600" y="330" width="170" height="130" rx="4" fill="url(#wood)"/>
  <g stroke="#6E4E16" stroke-width="2" opacity="0.6">
    <line x1="600" y1="365" x2="770" y2="365"/>
    <line x1="600" y1="400" x2="770" y2="400"/>
    <line x1="600" y1="435" x2="770" y2="435"/>
  </g>
  <!-- Loungers -->
  <g>
    <path d="M635 350 l 0 60 l 6 24 l 40 0 l 6 -24 l 0 -60 Z" fill="#E4C97F"/>
    <path d="M635 372 l 52 0" stroke="#8A6420" stroke-width="3"/>
    <path d="M692 342 l 0 80" stroke="#7A5A1C" stroke-width="3"/>
    <path d="M666 342 A 26 9 0 0 1 718 342 Z" fill="#C0563B"/>
    <path d="M666 342 A 26 9 0 0 1 718 342" fill="none" stroke="#F2D9A0" stroke-width="2"/>
  </g>
  <g>
    <path d="M695 380 l 0 56 l 6 22 l 38 0 l 6 -22 l 0 -56 Z" fill="#E4C97F"/>
    <path d="M695 400 l 50 0" stroke="#8A6420" stroke-width="3"/>
