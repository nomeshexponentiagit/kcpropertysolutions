    <path d="M706 372 A 24 8 0 0 1 754 372" fill="none" stroke="#A8E6EA" stroke-width="2"/>
  </g>
  <!-- Stepping-stone path -->
  <g fill="#4A3B22" opacity="0.75">
    <ellipse cx="120" cy="520" rx="22" ry="10"/>
    <ellipse cx="220" cy="535" rx="20" ry="9"/>
    <ellipse cx="320" cy="520" rx="21" ry="10"/>
    <ellipse cx="420" cy="528" rx="20" ry="9"/>
  </g>
  <!-- Brass label -->
  <rect x="30" y="520" width="160" height="50" rx="4" fill="#C9A227" opacity="0.92"/>
  <text x="110" y="552" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#06281E" letter-spacing="2">POOL DECK</text>
