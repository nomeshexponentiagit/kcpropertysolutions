<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A3528"/>
      <stop offset="55%" stop-color="#12674A"/>
      <stop offset="100%" stop-color="#1F7F9C"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2E9FB0"/>
      <stop offset="100%" stop-color="#0E4A5C"/>
    </linearGradient>
    <g id="palmS">
      <path d="M0 0 C 4 45 -6 90 2 130" stroke="#06281E" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C -12 -22 -36 -40 -60 -40 C -46 -18 -22 -8 0 0 Z" fill="#06281E"/>
      <path d="M0 0 C 2 -24 10 -46 28 -56 C 20 -32 8 -14 0 0 Z" fill="#06281E"/>
      <path d="M0 0 C 14 -20 34 -34 58 -28 C 38 -12 18 -6 0 0 Z" fill="#06281E"/>
      <path d="M0 0 C -8 -18 -18 -32 -26 -48 C -4 -34 4 -16 0 0 Z" fill="#06281E"/>
      <path d="M0 0 C 10 -14 20 -22 30 -26 C 22 -8 10 -2 0 0 Z" fill="#06281E"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- Resort bank (top-left) -->
  <path d="M0 0 L 470 0 L 470 360 C 360 320 240 330 150 360 C 90 380 40 400 0 430 Z" fill="#0B3D2C"/>
  <path d="M470 0 L 530 0 L 530 340 C 470 340 460 360 470 360 Z" fill="#0B3D2C"/>
  <!-- Sand -->
  <path d="M470 360 C 560 430 620 480 800 500 L 800 600 L 0 600 C 40 520 130 470 150 360 C 240 330 360 320 470 360 Z" fill="#E4C97F" opacity="0.92"/>
  <!-- Ocean -->
  <path d="M470 360 C 560 430 620 480 800 500 L 800 600 L 0 600 C 40 520 130 470 150 360 Z" fill="url(#sea)" opacity="0.6"/>
  <!-- Waves -->
  <path d="M560 430 q 20 -10 40 0 q 20 -10 40 0" stroke="#A8E6EA" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M300 520 q 18 -9 36 0 q 18 -9 36 0" stroke="#A8E6EA" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M640 540 q 22 -11 44 0 q 22 -11 44 0" stroke="#A8E6EA" stroke-width="3" fill="none" opacity="0.55"/>
  <path d="M470 560 q 16 -8 32 0 q 16 -8 32 0" stroke="#A8E6EA" stroke-width="2" fill="none" opacity="0.45"/>
  <!-- Boardwalk from resort to beach -->
  <g stroke="#B98A2F" stroke-width="4" opacity="0.9">
    <path d="M390 330 L 330 452" />
    <path d="M402 332 L 342 454" />
    <path d="M378 336 L 318 458" />
  </g>
  <g stroke="#8A6420" stroke-width="3" opacity="0.7">
    <path d="M368 372 L 356 412 M382 376 L 370 416 M396 380 L 384 420" />
  </g>
  <!-- Stilt cottage on the bank -->
  <g>
    <rect x="86" y="330" width="8" height="30" fill="#06281E" opacity="0.85"/>
    <rect x="100" y="334" width="8" height="30" fill="#06281E" opacity="0.85"/>
    <rect x="78" y="292" width="46" height="40" rx="4" fill="#06281E" opacity="0.9"/>
    <path d="M70 292 L101 268 L132 292 Q101 299 70 292 Z" fill="#2E8B67"/>
    <circle cx="93" cy="308" r="5" fill="#C9A227" opacity="0.8"/>
    <rect x="97" y="312" width="12" height="20" rx="6" fill="#0A3528"/>
  </g>
  <!-- Beach umbrella on sand -->
  <path d="M612 452 L 612 500" stroke="#7A5A1C" stroke-width="4"/>
  <path d="M576 452 A 40 14 0 0 1 648 452 Z" fill="#C0563B"/>
  <path d="M612 452 A 40 14 0 0 1 648 452" fill="none" stroke="#F2D9A0" stroke-width="2"/>
  <!-- Palms leaning over the bank -->
  <use href="#palmS" transform="translate(300 300) scale(1.1) rotate(8)"/>
  <use href="#palmS" transform="translate(430 285) scale(0.9) rotate(-10)"/>
  <use href="#palmS" transform="translate(120 260) scale(1.05) rotate(6)"/>
  <!-- Birds -->
  <path d="M180 120 q 8 -8 16 0 q 8 -8 16 0" stroke="#06281E" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M240 145 q 6 -6 12 0 q 6 -6 12 0" stroke="#06281E" stroke-width="2" fill="none" opacity="0.45"/>
  <!-- Brass label -->
  <rect x="30" y="520" width="216" height="52" rx="4" fill="#C9A227" opacity="0.92"/>
  <text x="138" y="553" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#06281E" letter-spacing="1.5">BEACH ACCESS</text>
</svg>
