    <rect x="346" y="260" width="40" height="34" rx="2"/><rect x="400" y="260" width="40" height="34" rx="2"/>
    <rect x="346" y="310" width="40" height="34" rx="2"/><rect x="400" y="310" width="40" height="34" rx="2"/>
    <rect x="346" y="360" width="40" height="34" rx="2"/><rect x="400" y="360" width="40" height="34" rx="2"/>
  </g>
  <!-- Trees in courtyard -->
