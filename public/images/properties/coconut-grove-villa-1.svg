<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="cv1" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F523C"/>
      <stop offset="100%" stop-color="#2E6E7E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cv1)"/>
  <!-- Floor -->
  <rect x="0" y="440" width="800" height="160" fill="#06281E" opacity="0.3"/>
  <!-- Sunlight through the arch -->
  <circle cx="400" cy="300" r="80" fill="#F2E3C0" opacity="0.3"/>
  <!-- Big arched window -->
  <path d="M220 440 v-200 a180 180 0 0 1 360 0 v200Z" fill="#8FC8CE" opacity="0.1" stroke="#F2E3C0" stroke-width="4" stroke-opacity="0.5"/>
  <g stroke="#F2E3C0" stroke-width="3" opacity="0.35">
    <line x1="310" y1="440" x2="310" y2="95"/>
    <line x1="400" y1="440" x2="400" y2="70"/>
    <line x1="490" y1="440" x2="490" y2="95"/>
  </g>
  <!-- Pendant lights -->
  <g opacity="0.6" stroke="#C9A227" stroke-width="2">
    <line x1="250" y1="110" x2="250" y2="150"/>
    <line x1="550" y1="110" x2="550" y2="150"/>
  </g>
  <circle cx="250" cy="165" r="12" fill="#C9A227" opacity="0.6"/>
  <circle cx="550" cy="165" r="12" fill="#C9A227" opacity="0.6"/>
  <!-- Potted palm -->
  <g opacity="0.4" fill="#F2E3C0">
    <ellipse cx="700" cy="400" rx="3" ry="65"/>
    <path d="M700 335 l-28 38 26-5 20 28 6-17-17-7 26-34h-6l-9 19-6-19Z"/>
    <path d="M688 440 h24 v18 h-24Z"/>
  </g>
  <!-- Label -->
  <rect x="330" y="520" width="140" height="50" rx="4" fill="#C9A227" opacity="0.85"/>
  <text x="400" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#06281E">INTERIOR</text>
</svg>
