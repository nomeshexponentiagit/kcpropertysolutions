<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sh1" x1="800" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F523C"/>
      <stop offset="50%" stop-color="#1B6B4F"/>
      <stop offset="100%" stop-color="#239063"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sh1)"/>
  <!-- Hillside -->
  <ellipse cx="400" cy="640" rx="560" ry="220" fill="#0B3D2E" opacity="0.4"/>
  <!-- Background palms -->
  <g opacity="0.08">
    <g transform="translate(80,140) scale(0.6)">
      <ellipse cx="0" cy="55" rx="3" ry="55" fill="#C9A227"/>
      <path d="M0 0 C-30 -38, -70 -38, -92 -2" fill="none" stroke="#C9A227" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 0 C30 -38, 70 -38, 92 -2" fill="none" stroke="#C9A227" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 0 C-18 -55, -42 -58, -55 -32" fill="none" stroke="#C9A227" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 0 C18 -55, 42 -58, 55 -32" fill="none" stroke="#C9A227" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 0 C-6 -68, 6 -68, 0 -28" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(720,140) scale(0.6)">
      <ellipse cx="0" cy="55" rx="3" ry="55" fill="#C9A227"/>
      <path d="M0 0 C-30 -38, -70 -38, -92 -2" fill="none" stroke="#C9A227" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 0 C30 -38, 70 -38, 92 -2" fill="none" stroke="#C9A227" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 0 C-18 -55, -42 -58, -55 -32" fill="none" stroke="#C9A227" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 0 C18 -55, 42 -58, 55 -32" fill="none" stroke="#C9A227" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 0 C-6 -68, 6 -68, 0 -28" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Plot boundary (prominent, double-line with corner posts) -->
  <rect x="170" y="130" width="460" height="300" fill="none" stroke="#C9A227" stroke-width="3.5" stroke-dasharray="22,7" opacity="0.9"/>
  <rect x="200" y="160" width="400" height="240" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.3"/>
  <!-- Corner posts -->
  <g fill="#C9A227" opacity="0.6">
    <rect x="163" y="123" width="14" height="14"/>
    <rect x="623" y="123" width="14" height="14"/>
    <rect x="623" y="423" width="14" height="14"/>
    <rect x="163" y="423" width="14" height="14"/>
  </g>
  <!-- Compass rose -->
  <g opacity="0.2" stroke="#C9A227" stroke-width="1.5" transform="translate(705,470)">
    <line x1="0" y1="-30" x2="0" y2="30"/>
    <line x1="-30" y1="0" x2="30" y2="0"/>
    <polygon points="0,-30 5,-10 0,-15 -5,-10" fill="#C9A227"/>
    <text x="0" y="-35" text-anchor="middle" font-size="10" fill="#C9A227" font-family="sans-serif">N</text>
  </g>
  <!-- Label -->
  <rect x="30" y="520" width="190" height="50" rx="4" fill="#C9A227" opacity="0.85"/>
  <text x="125" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#FFFFFF">PLOT BOUNDARY</text>
</svg>
