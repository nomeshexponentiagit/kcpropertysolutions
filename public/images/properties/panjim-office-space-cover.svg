<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0F16"/>
      <stop offset="55%" stop-color="#141E2B"/>
      <stop offset="100%" stop-color="#212F40"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C565"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4A5E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0D141D" stop-opacity="0.95"/>
    </linearGradient>
    <polygon id="beam" points="0,0 300,0 150,180 0,160"/>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Brass light beam -->
  <path d="M0 0 L330 0 L170 190 L0 170 Z" fill="#E3C565" opacity="0.08"/>
  <!-- Geometric sun -->
  <circle cx="650" cy="110" r="72" fill="url(#gold)" opacity="0.35"/>
  <circle cx="650" cy="110" r="40" fill="#E3C565" opacity="0.6"/>
  <!-- Office building: stepped angular volumes -->
  <g>
    <!-- Upper tower (floors 3-5) -->
    <rect x="265" y="140" width="270" height="160" fill="url(#glass)"/>
    <rect x="265" y="140" width="270" height="160" fill="#C9A227" opacity="0.06"/>
    <!-- Curtain wall mullions -->
    <g stroke="#C9A227" stroke-width="1.5" opacity="0.4">
      <line x1="295" y1="140" x2="295" y2="300"/>
      <line x1="325" y1="140" x2="325" y2="300"/>
      <line x1="355" y1="140" x2="355" y2="300"/>
      <line x1="385" y1="140" x2="385" y2="300"/>
      <line x1="415" y1="140" x2="415" y2="300"/>
      <line x1="445" y1="140" x2="445" y2="300"/>
      <line x1="475" y1="140" x2="475" y2="300"/>
      <line x1="505" y1="140" x2="505" y2="300"/>
    </g>
    <g stroke="#C9A227" stroke-width="1.5" opacity="0.4">
      <line x1="265" y1="190" x2="535" y2="190"/>
      <line x1="265" y1="240" x2="535" y2="240"/>
    </g>
    <!-- Lit windows -->
    <g fill="#E3C565">
      <rect x="274" y="152" width="14" height="12" opacity="0.7"/>
      <rect x="304" y="152" width="14" height="12" opacity="0.4"/>
      <rect x="394" y="198" width="14" height="12" opacity="0.65"/>
      <rect x="484" y="152" width="14" height="12" opacity="0.5"/>
      <rect x="364" y="252" width="14" height="12" opacity="0.6"/>
      <rect x="454" y="252" width="14" height="12" opacity="0.45"/>
    </g>
    <!-- Angular parapet -->
    <polygon points="252,140 535,140 535,128 292,128" fill="url(#gold)"/>
    <rect x="268" y="120" width="264" height="8" fill="#0B1017"/>
    <!-- Rooftop terrace rail -->
    <g stroke="#C9A227" stroke-width="2" opacity="0.7">
      <line x1="285" y1="120" x2="285" y2="104"/>
      <line x1="320" y1="120" x2="320" y2="104"/>
      <line x1="355" y1="120" x2="355" y2="104"/>
      <line x1="390" y1="120" x2="390" y2="104"/>
      <line x1="425" y1="120" x2="425" y2="104"/>
      <line x1="460" y1="120" x2="460" y2="104"/>
      <line x1="495" y1="120" x2="495" y2="104"/>
      <line x1="530" y1="120" x2="530" y2="104"/>
    </g>
    <!-- Base block (floors G-2, wider) -->
    <rect x="230" y="300" width="340" height="170" fill="url(#glass)"/>
    <g stroke="#C9A227" stroke-width="1.5" opacity="0.35">
      <line x1="272" y1="300" x2="272" y2="470"/>
      <line x1="314" y1="300" x2="314" y2="470"/>
      <line x1="356" y1="300" x2="356" y2="470"/>
      <line x1="398" y1="300" x2="398" y2="470"/>
      <line x1="440" y1="300" x2="440" y2="470"/>
      <line x1="482" y1="300" x2="482" y2="470"/>
      <line x1="524" y1="300" x2="524" y2="470"/>
    </g>
    <g stroke="#C9A227" stroke-width="1.5" opacity="0.35">
      <line x1="230" y1="352" x2="570" y2="352"/>
      <line x1="230" y1="410" x2="570" y2="410"/>
    </g>
    <g fill="#E3C565">
      <rect x="242" y="312" width="14" height="12" opacity="0.55"/>
      <rect x="356" y="362" width="14" height="12" opacity="0.6"/>
      <rect x="512" y="312" width="14" height="12" opacity="0.45"/>
    </g>
    <!-- Ground lobby and canopy -->
    <rect x="230" y="410" width="340" height="60" fill="#0D141D"/>
    <rect x="210" y="402" width="380" height="10" fill="url(#gold)"/>
    <g stroke="#C9A227" stroke-width="2" opacity="0.6">
      <line x1="230" y1="410" x2="570" y2="410"/>
      <line x1="230" y1="470" x2="570" y2="470"/>
    </g>
    <rect x="356" y="418" width="24" height="52" fill="#060A0E"/>
    <rect x="390" y="418" width="24" height="52" fill="#060A0E"/>
    <rect x="350" y="418" width="36" height="52" stroke="#C9A227" stroke-width="3" fill="none"/>
    <rect x="384" y="418" width="36" height="52" stroke="#C9A227" stroke-width="3" fill="none"/>
    <rect x="236" y="440" width="60" height="8" fill="#E3C565" opacity="0.4"/>
    <rect x="508" y="448" width="54" height="8" fill="#E3C565" opacity="0.35"/>
  </g>
  <!-- Parking area with 4 slots -->
  <rect x="600" y="360" width="160" height="110" fill="#0F161F"/>
  <g stroke="#C9A227" stroke-width="2.5" opacity="0.7">
    <line x1="612" y1="360" x2="612" y2="470"/>
    <line x1="682" y1="360" x2="682" y2="470"/>
    <line x1="752" y1="360" x2="752" y2="470"/>
    <line x1="600" y1="415" x2="760" y2="415"/>
  </g>
  <g>
    <rect x="618" y="368" width="58" height="44" rx="6" fill="#1A2533"/>
    <rect x="624" y="376" width="46" height="16" rx="4" fill="#243447"/>
    <rect x="688" y="368" width="58" height="44" rx="6" fill="#1A2533"/>
    <rect x="694" y="376" width="46" height="16" rx="4" fill="#243447"/>
    <circle cx="640" cy="412" r="7" fill="#0B1017"/>
    <circle cx="666" cy="412" r="7" fill="#0B1017"/>
    <circle cx="710" cy="412" r="7" fill="#0B1017"/>
    <circle cx="736" cy="412" r="7" fill="#0B1017"/>
  </g>
  <!-- Street -->
  <rect x="0" y="470" width="800" height="130" fill="#090E15"/>
  <rect x="0" y="470" width="800" height="5" fill="#C9A227" opacity="0.35"/>
  <g fill="#E3C565" opacity="0.35">
    <rect x="150" y="524" width="80" height="4"/>
    <rect x="370" y="524" width="80" height="4"/>
    <rect x="590" y="524" width="80" height="4"/>
  </g>
  <!-- Street lamp -->
  <rect x="118" y="360" width="3" height="110" fill="#C9A227"/>
  <circle cx="119" cy="358" r="7" fill="#E3C565"/>
  <circle cx="119" cy="358" r="16" fill="#E3C565" opacity="0.2"/>
  <!-- Trees -->
  <g>
    <rect x="84" y="330" width="5" height="140" fill="#1A3B2E"/>
    <g fill="#1B4034">
      <circle cx="86" cy="300" r="26"/>
      <circle cx="60" cy="314" r="15"/>
      <circle cx="114" cy="316" r="14"/>
    </g>
    <rect x="750" y="340" width="5" height="130" fill="#1A3B2E"/>
    <g fill="#1B4034">
      <circle cx="752" cy="312" r="24"/>
      <circle cx="728" cy="324" r="13"/>
      <circle cx="778" cy="326" r="13"/>
    </g>
  </g>
  <!-- Birds -->
  <g stroke="#E3C565" stroke-width="2" opacity="0.5" fill="none">
    <path d="M140 120 Q148 112 156 120 Q164 112 172 120"/>
    <path d="M190 96 Q196 90 202 96 Q208 90 214 96"/>
  </g>
  <!-- Label -->
  <rect x="30" y="520" width="250" height="50" rx="4" fill="#C9A227" opacity="0.92"/>
  <text x="155" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#0B1017">PANJIM OFFICE SPACE</text>
</svg>
