<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sbi2bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A3527"/>
      <stop offset="60%" stop-color="#125C45"/>
      <stop offset="100%" stop-color="#C0563B" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sbi2bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E4E3C"/>
      <stop offset="100%" stop-color="#06281E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sbi2bg)"/>
  <!-- Side-on building, angled composition -->
  <g fill="url(#sbi2bld)">
    <rect x="250" y="130" width="420" height="350" rx="2"/>
  </g>
  <!-- Flat roof with terrace -->
  <rect x="240" y="116" width="440" height="18" fill="#C9A227" opacity="0.75"/>
  <g stroke="#C9A227" stroke-width="2" opacity="0.8" fill="none">
    <line x1="290" y1="116" x2="290" y2="96"/>
    <line x1="330" y1="116" x2="330" y2="96"/>
    <line x1="370" y1="116" x2="370" y2="96"/>
    <line x1="410" y1="116" x2="410" y2="96"/>
    <line x1="450" y1="116" x2="450" y2="96"/>
    <line x1="490" y1="116" x2="490" y2="96"/>
    <line x1="530" y1="116" x2="530" y2="96"/>
    <line x1="570" y1="116" x2="570" y2="96"/>
    <line x1="610" y1="116" x2="610" y2="96"/>
    <line x1="650" y1="116" x2="650" y2="96"/>
  </g>
  <!-- Long balconies with vertical rails (different from cover grid) -->
  <g stroke="#C9A227" stroke-width="2" opacity="0.75" fill="none">
    <rect x="270" y="180" width="120" height="56" rx="2"/>
    <rect x="410" y="180" width="120" height="56" rx="2"/>
    <rect x="550" y="180" width="100" height="56" rx="2"/>
    <rect x="270" y="262" width="120" height="56" rx="2"/>
    <rect x="410" y="262" width="120" height="56" rx="2"/>
    <rect x="550" y="262" width="100" height="56" rx="2"/>
    <rect x="270" y="344" width="120" height="56" rx="2"/>
    <rect x="410" y="344" width="120" height="56" rx="2"/>
    <rect x="550" y="344" width="100" height="56" rx="2"/>
    <rect x="270" y="414" width="120" height="26" rx="2"/>
    <rect x="410" y="414" width="120" height="26" rx="2"/>
    <rect x="550" y="414" width="100" height="26" rx="2"/>
  </g>
  <g stroke="#C9A227" stroke-width="1.2" opacity="0.5">
    <line x1="330" y1="180" x2="330" y2="236"/><line x1="390" y1="180" x2="390" y2="236"/>
    <line x1="470" y1="180" x2="470" y2="236"/><line x1="530" y1="180" x2="530" y2="236"/>
    <line x1="330" y1="262" x2="330" y2="318"/><line x1="390" y1="262" x2="390" y2="318"/>
    <line x1="470" y1="262" x2="470" y2="318"/><line x1="530" y1="262" x2="530" y2="318"/>
    <line x1="330" y1="344" x2="330" y2="400"/><line x1="390" y1="344" x2="390" y2="400"/>
    <line x1="470" y1="344" x2="470" y2="400"/><line x1="530" y1="344" x2="530" y2="400"/>
  </g>
  <!-- Entrance -->
  <rect x="300" y="438" width="70" height="42" rx="4" fill="#C9A227" opacity="0.7"/>
  <rect x="376" y="438" width="34" height="42" fill="#06281E"/>
  <!-- Side palm -->
  <g>
    <rect x="700" y="300" width="7" height="180" rx="3" fill="#0A3527"/>
    <g fill="#13674A">
      <path d="M703 300 C680 276 664 260 648 276 C666 282 680 292 690 304 Z"/>
      <path d="M703 300 C728 274 748 262 766 278 C746 286 730 296 716 304 Z"/>
      <path d="M703 300 C686 284 678 268 684 248 C694 266 700 280 712 298 Z"/>
    </g>
  </g>
  <!-- Bushes -->
  <g fill="#13674A" opacity="0.8">
    <circle cx="170" cy="470" r="26"/>
    <circle cx="210" cy="476" r="18"/>
    <circle cx="560" cy="474" r="20"/>
    <circle cx="596" cy="478" r="14"/>
  </g>
  <!-- Road -->
  <rect x="0" y="486" width="800" height="114" fill="#0A3527" opacity="0.9"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#C9A227" stroke-width="2" opacity="0.3" stroke-dasharray="30 24"/>
  <!-- BUILDING VIEW label -->
  <rect x="30" y="520" width="230" height="50" rx="4" fill="#C9A227" opacity="0.9"/>
  <text x="145" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#06281E">BUILDING VIEW</text>
</svg>
