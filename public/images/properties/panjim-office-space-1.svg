      <rect x="222" y="352" width="40" height="28" rx="3"/>
      <rect x="226" y="356" width="32" height="18" rx="2" fill="#243447" opacity="0.9"/>
      <rect x="284" y="352" width="40" height="28" rx="3"/>
      <rect x="288" y="356" width="32" height="18" rx="2" fill="#243447" opacity="0.9"/>
      <rect x="346" y="352" width="40" height="28" rx="3"/>
      <rect x="350" y="356" width="32" height="18" rx="2" fill="#243447" opacity="0.9"/>
