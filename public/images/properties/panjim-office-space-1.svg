<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C565"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="wsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C2A3C"/>
      <stop offset="100%" stop-color="#0E141D"/>
    </linearGradient>
    <radialGradient id="pend" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E3C565" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E3C565" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Ceiling -->
  <polygon points="0,0 800,0 680,130 120,130" fill="#0F151E"/>
  <!-- Floor -->
  <polygon points="0,600 800,600 680,420 120,420" fill="#1A2430"/>
  <polygon points="160,600 640,600 560,430 240,430" fill="#1E2936"/>
  <!-- Back wall -->
