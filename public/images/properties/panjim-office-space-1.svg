    <rect x="140" y="96" width="60" height="10" rx="4" fill="url(#gold)"/>
    <circle cx="170" cy="110" r="18" fill="url(#pend)"/>
    <rect x="360" y="58" width="60" height="6" rx="3" fill="url(#gold)"/>
    <line x1="390" y1="58" x2="390" y2="96" stroke="#C9A227" stroke-width="1.5"/>
