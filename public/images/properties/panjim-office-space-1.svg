    <circle cx="390" cy="110" r="18" fill="url(#pend)"/>
    <rect x="580" y="58" width="60" height="6" rx="3" fill="url(#gold)"/>
    <line x1="610" y1="58" x2="610" y2="96" stroke="#C9A227" stroke-width="1.5"/>
