      <rect x="355" y="505" width="24" height="14"/><rect x="395" y="505" width="24" height="14"/>
      <rect x="435" y="505" width="24" height="14"/><rect x="475" y="505" width="24" height="14"/>
      <rect x="275" y="530" width="24" height="14"/><rect x="315" y="530" width="24" height="14"/>
      <rect x="355" y="530" width="24" height="14"/><rect x="395" y="530" width="24" height="14"/>
      <rect x="435" y="530" width="24" height="14"/><rect x="475" y="530" width="24" height="14"/>
    </g>
  </g>
  <!-- Moon streak + ripples -->
  <rect x="390" y="484" width="20" height="74" fill="#F7D97E" opacity="0.18"/>
  <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M260 520 Q310 514 360 520 T460 520 T540 520"/>
    <path d="M260 545 Q310 539 360 545 T460 545 T540 545"/>
  </g>
  <!-- Palms -->
  <g stroke-linecap="round">
    <path d="M150 600 L156 470 Q158 420 164 372" stroke="#06233A" stroke-width="10" fill="none"/>
    <path d="M164 372 Q128 344 118 306 M164 372 Q150 330 172 308 M164 372 Q188 342 204 330 M164 372 Q140 356 128 338" stroke="#06233A" stroke-width="7" fill="none"/>
    <path d="M650 600 L646 480 Q644 430 638 380" stroke="#06233A" stroke-width="10" fill="none"/>
    <path d="M638 380 Q672 352 682 314 M638 380 Q652 338 630 316 M638 380 Q614 350 598 338 M638 380 Q662 364 674 346" stroke="#06233A" stroke-width="7" fill="none"/>
