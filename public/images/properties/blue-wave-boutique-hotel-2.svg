    <rect x="315" y="290" width="44" height="56" fill="#E8C766" opacity="0.9"/>
    <rect x="375" y="290" width="44" height="56" fill="#F7D97E" opacity="0.9"/>
    <rect x="435" y="290" width="44" height="56" fill="#F7D97E" opacity="0.9"/>
    <rect x="495" y="290" width="44" height="56" fill="#E8C766" opacity="0.9"/>
