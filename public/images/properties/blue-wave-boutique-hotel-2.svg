  <rect x="278" y="448" width="30" height="9" rx="3" fill="#E85D5D"/>
  <rect x="470" y="456" width="46" height="10" rx="3" fill="#0B3D5C"/>
  <rect x="478" y="448" width="30" height="9" rx="3" fill="#E85D5D"/>
