    <circle cx="300" cy="100" r="1.6"/><circle cx="370" cy="45" r="1.8"/><circle cx="450" cy="85" r="1.5"/>
    <circle cx="520" cy="40" r="2"/><circle cx="600" cy="95" r="1.6"/><circle cx="680" cy="55" r="1.8"/>
    <circle cx="740" cy="120" r="1.5"/><circle cx="620" cy="160" r="1.6"/><circle cx="260" cy="160" r="1.5"/>
  </g>
  <!-- Moon -->
