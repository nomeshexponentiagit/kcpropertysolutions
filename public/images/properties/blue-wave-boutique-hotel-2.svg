  <rect x="30" y="30" width="200" height="50" rx="4" fill="#C9A227" opacity="0.9"/>
  <text x="130" y="61" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#06281E">FAÇADE</text>
