    <line x1="378" y1="246" x2="378" y2="262"/><line x1="438" y1="246" x2="438" y2="262"/>
    <line x1="498" y1="246" x2="498" y2="262"/><line x1="548" y1="246" x2="548" y2="262"/>
    <line x1="258" y1="346" x2="258" y2="362"/><line x1="318" y1="346" x2="318" y2="362"/>
    <line x1="378" y1="346" x2="378" y2="362"/><line x1="438" y1="346" x2="438" y2="362"/>
    <line x1="498" y1="346" x2="498" y2="362"/><line x1="548" y1="346" x2="548" y2="362"/>
