<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bfSky" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0A2342"/>
      <stop offset="100%" stop-color="#155E8A"/>
    </linearGradient>
    <linearGradient id="bfPool" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1B6E9B"/>
      <stop offset="100%" stop-color="#06466B"/>
    </linearGradient>
    <linearGradient id="bfGold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E8C766"/>
      <stop offset="55%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8F6F14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bfSky)"/>
  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.9">
