<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D131B"/>
      <stop offset="100%" stop-color="#1E2B3D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C565"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.4">
      <stop offset="0%" stop-color="#E3C565" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E3C565" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- Sun on the horizon -->
  <circle cx="400" cy="250" r="54" fill="url(#gold)" opacity="0.55"/>
  <!-- Sidewalk ground plane -->
  <polygon points="0,600 800,600 800,520 0,520" fill="#0B1119"/>
  <polygon points="40,600 760,600 520,400 280,400" fill="#111A25"/>
  <polygon points="100,600 700,600 470,410 330,410" fill="#141E2A" opacity="0.5"/>
  <!-- The complex in the distance (centre) -->
  <rect x="340" y="120" width="120" height="110" fill="#233243"/>
  <rect x="352" y="132" width="96" height="40" fill="#E3C565" opacity="0.25"/>
  <rect x="352" y="178" width="96" height="40" fill="#E3C565" opacity="0.2"/>
  <rect x="340" y="108" width="120" height="12" fill="url(#gold)"/>
  <rect x="340" y="230" width="120" height="170" fill="#182332"/>
  <g stroke="#C9A227" stroke-width="2" opacity="0.55">
