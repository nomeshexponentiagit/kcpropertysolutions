    <line x1="340" y1="400" x2="460" y2="400"/>
  </g>
  <g stroke="#C9A227" stroke-width="1.5" opacity="0.45">
    <line x1="380" y1="230" x2="380" y2="400"/>
    <line x1="420" y1="230" x2="420" y2="400"/>
  </g>
  <rect x="352" y="256" width="24" height="18" fill="#E3C565" opacity="0.5"/>
  <rect x="424" y="290" width="24" height="18" fill="#E3C565" opacity="0.45"/>
  <rect x="380" y="336" width="24" height="18" fill="#E3C565" opacity="0.55"/>
  <!-- Left building row -->
  <polygon points="0,520 320,408 320,600 0,600" fill="#161F2C"/>
  <rect x="0" y="356" width="80" height="52" fill="#1B2735"/>
  <rect x="90" y="368" width="80" height="40" fill="#1B2735"/>
  <rect x="180" y="380" width="80" height="28" fill="#1B2735"/>
  <rect x="0" y="356" width="260" height="10" fill="#0B1017"/>
  <rect x="0" y="356" width="260" height="3" fill="url(#gold)" opacity="0.6"/>
  <g stroke="#C9A227" stroke-width="2" opacity="0.5">
    <line x1="10" y1="408" x2="10" y2="600"/>
    <line x1="80" y1="408" x2="80" y2="600"/>
    <line x1="160" y1="408" x2="160" y2="600"/>
    <line x1="240" y1="408" x2="240" y2="600"/>
  </g>
  <rect x="24" y="430" width="40" height="120" fill="#0D141D" stroke="#C9A227" stroke-width="1.5"/>
  <rect x="176" y="438" width="40" height="112" fill="#0D141D" stroke="#C9A227" stroke-width="1.5"/>
  <rect x="40" y="452" width="16" height="10" fill="#E3C565" opacity="0.5"/>
  <!-- Right building row -->
  <polygon points="800,520 480,408 480,600 800,600" fill="#141D2A"/>
  <rect x="600" y="360" width="80" height="48" fill="#1A2634"/>
  <rect x="690" y="372" width="80" height="36" fill="#1A2634"/>
  <rect x="540" y="408" width="260" height="10" fill="#0B1017"/>
  <rect x="540" y="408" width="260" height="3" fill="url(#gold)" opacity="0.6"/>
