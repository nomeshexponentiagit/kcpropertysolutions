    <circle cx="331" cy="278" r="6" fill="#E3C565"/>
    <circle cx="331" cy="278" r="14" fill="#E3C565" opacity="0.18"/>
    <rect x="468" y="288" width="3" height="120" fill="#C9A227"/>
    <circle cx="469" cy="286" r="6" fill="#E3C565"/>
