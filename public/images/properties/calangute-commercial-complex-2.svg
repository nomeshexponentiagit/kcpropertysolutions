  <path d="M20 210 Q400 240 780 190" stroke="#C9A227" stroke-width="2" opacity="0.7" fill="none"/>
  <g fill="#C9A227" opacity="0.7">
    <path d="M80 220 l10 16 -10 3 -10 -3Z"/>
    <path d="M150 227 l10 16 -10 3 -10 -3Z"/>
    <path d="M220 233 l10 16 -10 3 -10 -3Z"/>
    <path d="M290 237 l10 16 -10 3 -10 -3Z"/>
    <path d="M360 239 l10 16 -10 3 -10 -3Z"/>
    <path d="M430 238 l10 16 -10 3 -10 -3Z"/>
    <path d="M500 235 l10 16 -10 3 -10 -3Z"/>
    <path d="M570 230 l10 16 -10 3 -10 -3Z"/>
    <path d="M640 224 l10 16 -10 3 -10 -3Z"/>
    <path d="M710 217 l10 16 -10 3 -10 -3Z"/>
  </g>
  <!-- Trees -->
  <g>
    <rect x="92" y="330" width="5" height="80" fill="#1A3B2E"/>
    <circle cx="94" cy="310" r="26" fill="#1B4034"/>
    <circle cx="72" cy="322" r="16" fill="#1B4034"/>
    <circle cx="118" cy="324" r="15" fill="#1B4034"/>
    <rect x="708" y="336" width="5" height="74" fill="#1A3B2E"/>
    <circle cx="710" cy="318" r="24" fill="#1B4034"/>
    <circle cx="688" cy="330" r="14" fill="#1B4034"/>
    <circle cx="734" cy="332" r="14" fill="#1B4034"/>
  </g>
  <!-- Label -->
  <rect x="30" y="520" width="170" height="50" rx="4" fill="#C9A227" opacity="0.92"/>
  <text x="115" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#0B1017">STREET VIEW</text>
</svg>
