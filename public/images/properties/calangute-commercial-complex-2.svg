    <line x1="640" y1="418" x2="640" y2="600"/>
    <line x1="720" y1="418" x2="720" y2="600"/>
  </g>
  <rect x="576" y="440" width="48" height="112" fill="#0D141D" stroke="#C9A227" stroke-width="1.5"/>
  <rect x="664" y="432" width="48" height="120" fill="#0D141D" stroke="#C9A227" stroke-width="1.5"/>
  <rect x="588" y="456" width="16" height="10" fill="#E3C565" opacity="0.5"/>
