  </g>
  <!-- Parked scooters -->
  <g fill="#0A0F16" opacity="0.9">
    <rect x="560" y="500" width="26" height="10" rx="4"/>
    <circle cx="566" cy="512" r="4"/>
    <circle cx="580" cy="512" r="4"/>
    <rect x="596" y="502" width="26" height="10" rx="4"/>
    <circle cx="602" cy="514" r="4"/>
    <circle cx="616" cy="514" r="4"/>
