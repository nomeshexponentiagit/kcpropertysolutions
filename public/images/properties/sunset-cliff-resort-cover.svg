<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sunsky" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2B1A3D"/>
      <stop offset="45%" stop-color="#8E3B2E"/>
      <stop offset="100%" stop-color="#E88B3A"/>
    </linearGradient>
    <linearGradient id="seas" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1E4E6B"/>
      <stop offset="100%" stop-color="#0F2E45"/>
    </linearGradient>
    <g id="palmC">
      <path d="M0 0 C 4 45 -6 90 2 130" stroke="#1E0E08" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C -12 -22 -36 -40 -60 -40 C -46 -18 -22 -8 0 0 Z" fill="#1E0E08"/>
      <path d="M0 0 C 2 -24 10 -46 28 -56 C 20 -32 8 -14 0 0 Z" fill="#1E0E08"/>
      <path d="M0 0 C 14 -20 34 -34 58 -28 C 38 -12 18 -6 0 0 Z" fill="#1E0E08"/>
      <path d="M0 0 C -8 -18 -18 -32 -26 -48 C -4 -34 4 -16 0 0 Z" fill="#1E0E08"/>
      <path d="M0 0 C 10 -14 20 -22 30 -26 C 22 -8 10 -2 0 0 Z" fill="#1E0E08"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="url(#sunsky)"/>
  <!-- Sun -->
  <circle cx="585" cy="340" r="80" fill="#F2B36E" opacity="0.3"/>
  <circle cx="585" cy="340" r="46" fill="#FFD9A0"/>
  <!-- Sea -->
  <path d="M0 390 L 800 390 L 800 600 L 0 600 Z" fill="url(#seas)"/>
  <rect x="545" y="390" width="80" height="60" fill="#FFD9A0" opacity="0.35"/>
  <rect x="555" y="390" width="60" height="120" fill="#FFD9A0" opacity="0.18"/>
  <path d="M0 420 q 25 -10 50 0 q 25 -10 50 0" stroke="#7FB6CC" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M220 460 q 22 -9 44 0 q 22 -9 44 0" stroke="#7FB6CC" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M640 500 q 24 -10 48 0 q 24 -10 48 0" stroke="#7FB6CC" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M90 540 q 20 -8 40 0 q 20 -8 40 0" stroke="#7FB6CC" stroke-width="2" fill="none" opacity="0.35"/>
  <!-- Sailing boat -->
  <path d="M300 470 l -16 0 l 16 22 Z" fill="#1E0E08"/>
  <path d="M316 470 l 0 26 l 22 -22 Z" fill="#E8C56A" opacity="0.9"/>
  <!-- Cliff with resort terraces -->
  <path d="M540 390 L 520 520 L 620 560 L 800 560 L 800 390 Z" fill="#2A1A12"/>
  <path d="M540 390 L 800 390 L 800 420 L 560 420 Q 545 405 540 390 Z" fill="#3A2815"/>
  <path d="M560 420 L 800 420 L 800 470 L 585 470 Q 566 448 560 420 Z" fill="#4A3520"/>
  <path d="M600 470 L 800 470 L 800 530 L 630 530 Q 610 500 600 470 Z" fill="#5C4530"/>
  <!-- Windows glowing on cliff terraces -->
  <g fill="#FFD9A0" opacity="0.85">
    <rect x="640" y="435" width="12" height="10" rx="2"/>
    <rect x="670" y="435" width="12" height="10" rx="2"/>
    <rect x="700" y="435" width="12" height="10" rx="2"/>
    <rect x="655" y="490" width="12" height="10" rx="2"/>
    <rect x="690" y="490" width="12" height="10" rx="2"/>
    <rect x="725" y="490" width="12" height="10" rx="2"/>
    <rect x="680" y="540" width="12" height="10" rx="2"/>
    <rect x="720" y="540" width="12" height="10" rx="2"/>
  </g>
  <!-- Palms on the cliff -->
  <use href="#palmC" transform="translate(580 350) scale(0.85)"/>
  <use href="#palmC" transform="translate(760 330) scale(0.7)"/>
  <use href="#palmC" transform="translate(512 355) scale(0.6)"/>
  <!-- Birds -->
  <path d="M230 180 q 8 -8 16 0 q 8 -8 16 0" stroke="#2B1A3D" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M270 210 q 6 -6 12 0 q 6 -6 12 0" stroke="#2B1A3D" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Brass label -->
  <rect x="30" y="520" width="240" height="54" rx="4" fill="#C9A227" opacity="0.92"/>
  <text x="150" y="553" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#06281E" letter-spacing="1.5">SUNSET CLIFF RESORT</text>
</svg>
