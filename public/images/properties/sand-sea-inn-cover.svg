    <ellipse cx="610" cy="100" rx="60" ry="12"/>
    <ellipse cx="330" cy="140" rx="50" ry="11"/>
  </g>
  <!-- Birds -->
  <g stroke="#155E8A" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M420 180 Q430 173 440 180 Q450 173 460 180"/>
    <path d="M465 198 Q475 191 485 198 Q495 191 505 198"/>
  </g>
  <!-- Sea -->
  <rect x="0" y="320" width="800" height="105" fill="url(#ssSea)"/>
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.45" fill="none">
