    <circle cx="70" cy="470" r="2.5"/><circle cx="150" cy="500" r="2"/><circle cx="230" cy="460" r="2.5"/>
    <circle cx="330" cy="520" r="2"/><circle cx="700" cy="470" r="2.5"/><circle cx="760" cy="510" r="2"/>
    <circle cx="640" cy="450" r="2"/><circle cx="480" cy="540" r="2.5"/><circle cx="90" cy="550" r="2"/>
  </g>
  <!-- Inn building -->
  <rect x="230" y="192" width="340" height="8" fill="#C9A227"/>
  <rect x="230" y="200" width="340" height="72" fill="#FBF6EF"/>
  <rect x="230" y="272" width="340" height="4" fill="#C9A227"/>
  <rect x="230" y="276" width="340" height="84" fill="#FBF6EF"/>
  <rect x="230" y="360" width="340" height="4" fill="#C9A227"/>
  <rect x="230" y="364" width="340" height="66" fill="#EAD9B8"/>
