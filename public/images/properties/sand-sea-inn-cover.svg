<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="ssSky" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4FA9CE"/>
      <stop offset="55%" stop-color="#A8DCEB"/>
      <stop offset="100%" stop-color="#E6F4F8"/>
    </linearGradient>
    <linearGradient id="ssSea" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1B6E9B"/>
      <stop offset="100%" stop-color="#0A5C8A"/>
    </linearGradient>
    <linearGradient id="ssSand" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E8D5A8"/>
      <stop offset="100%" stop-color="#D9BE8E"/>
    </linearGradient>
    <linearGradient id="ssGold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E8C766"/>
      <stop offset="55%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8F6F14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ssSky)"/>
  <!-- Sun -->
  <circle cx="130" cy="110" r="42" fill="#F7D97E" opacity="0.95"/>
  <circle cx="130" cy="110" r="68" fill="#F7D97E" opacity="0.22"/>
  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.55">
