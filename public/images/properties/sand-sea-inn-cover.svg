  <rect x="258" y="378" width="80" height="48" fill="#2E6E8E" opacity="0.8" stroke="#FFFFFF" stroke-width="2.5"/>
  <rect x="462" y="378" width="80" height="48" fill="#2E6E8E" opacity="0.8" stroke="#FFFFFF" stroke-width="2.5"/>
  <g stroke="#FFFFFF" stroke-width="2.5">
