    <rect x="250" y="368" width="96" height="10" fill="#FFFFFF"/>
    <rect x="262" y="368" width="12" height="10" fill="#C9A227"/><rect x="286" y="368" width="12" height="10" fill="#C9A227"/>
    <rect x="310" y="368" width="12" height="10" fill="#C9A227"/><rect x="334" y="368" width="12" height="10" fill="#C9A227"/>
    <rect x="454" y="368" width="96" height="10" fill="#FFFFFF"/>
    <rect x="466" y="368" width="12" height="10" fill="#C9A227"/><rect x="490" y="368" width="12" height="10" fill="#C9A227"/>
    <rect x="514" y="368" width="12" height="10" fill="#C9A227"/><rect x="538" y="368" width="12" height="10" fill="#C9A227"/>
    <rect x="364" y="362" width="72" height="10" fill="#FFFFFF"/>
    <rect x="376" y="362" width="12" height="10" fill="#C9A227"/><rect x="400" y="362" width="12" height="10" fill="#C9A227"/>
    <rect x="424" y="362" width="12" height="10" fill="#C9A227"/>
