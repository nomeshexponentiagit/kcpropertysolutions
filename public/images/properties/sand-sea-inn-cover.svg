    <rect x="352" y="288" width="40" height="42" fill="#2E6E8E" opacity="0.85"/>
    <rect x="432" y="288" width="40" height="42" fill="#2E6E8E" opacity="0.85"/>
    <rect x="512" y="288" width="40" height="42" fill="#2E6E8E" opacity="0.85"/>
