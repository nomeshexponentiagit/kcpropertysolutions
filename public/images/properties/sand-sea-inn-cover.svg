  <text x="400" y="354" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#C9A227">SAND &amp; SEA INN</text>
  <!-- Palms -->
  <g stroke-linecap="round">
    <path d="M150 470 Q155 400 165 335" stroke="#6B4A2B" stroke-width="9" fill="none"/>
    <path d="M165 335 Q130 305 118 265 M165 335 Q150 292 175 270 M165 335 Q188 305 205 292 M165 335 Q140 318 126 300 M165 335 Q196 325 212 308" stroke="#0B5E3B" stroke-width="6" fill="none"/>
    <path d="M650 470 Q645 400 635 335" stroke="#6B4A2B" stroke-width="9" fill="none"/>
    <path d="M635 335 Q670 305 682 265 M635 335 Q650 292 625 270 M635 335 Q612 305 595 292 M635 335 Q660 318 674 300 M635 335 Q604 325 588 308" stroke="#0B5E3B" stroke-width="6" fill="none"/>
  </g>
  <!-- Beach umbrella -->
  <path d="M115 542 L115 478" stroke="#6B4A2B" stroke-width="4"/>
  <path d="M55 478 Q115 428 175 478 Z" fill="#E85D5D"/>
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.8">
    <path d="M75 476 Q95 460 115 456" fill="none"/>
    <path d="M115 456 Q135 460 155 476" fill="none"/>
  </g>
  <!-- Beach ball -->
  <circle cx="610" cy="528" r="16" fill="#F7D97E" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="610" cy="528" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Small boat on sand -->
  <path d="M556 566 L620 566 L610 580 L566 580 Z" fill="#C9A227"/>
  <line x1="588" y1="566" x2="588" y2="552" stroke="#6B4A2B" stroke-width="2.5"/>
  <!-- Brass label -->
  <rect x="30" y="520" width="280" height="50" rx="4" fill="#C9A227" opacity="0.9"/>
  <text x="170" y="551" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#06281E">SAND &amp; SEA INN</text>
</svg>
