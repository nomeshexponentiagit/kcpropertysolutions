<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="mri2bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081F17"/>
      <stop offset="55%" stop-color="#125C45"/>
      <stop offset="100%" stop-color="#1E8A5F" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="mri2tw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E4E3C"/>
      <stop offset="100%" stop-color="#052119"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mri2bg)"/>
  <!-- Sunset glow -->
  <circle cx="620" cy="330" r="90" fill="#C0563B" opacity="0.35"/>
  <circle cx="620" cy="330" r="55" fill="#E3C565" opacity="0.4"/>
  <!-- Tower, front elevation with full-width balconies -->
  <g fill="url(#mri2tw)">
    <rect x="180" y="90" width="240" height="400" rx="2"/>
  </g>
  <rect x="172" y="76" width="256" height="18" fill="#C9A227" opacity="0.75"/>
  <!-- Balcony glass banding -->
  <g fill="#C9A227" opacity="0.45">
    <rect x="192" y="130" width="216" height="30"/>
    <rect x="192" y="196" width="216" height="30"/>
    <rect x="192" y="262" width="216" height="30"/>
    <rect x="192" y="328" width="216" height="30"/>
    <rect x="192" y="394" width="216" height="30"/>
  </g>
  <g stroke="#C9A227" stroke-width="1.5" opacity="0.7">
    <line x1="192" y1="160" x2="408" y2="160"/>
    <line x1="192" y1="226" x2="408" y2="226"/>
    <line x1="192" y1="292" x2="408" y2="292"/>
    <line x1="192" y1="358" x2="408" y2="358"/>
    <line x1="192" y1="424" x2="408" y2="424"/>
  </g>
  <!-- Vertical mullions -->
  <g stroke="#C9A227" stroke-width="1.2" opacity="0.5">
    <line x1="246" y1="130" x2="246" y2="424"/><line x1="300" y1="130" x2="300" y2="424"/><line x1="354" y1="130" x2="354" y2="424"/>
  </g>
  <!-- Entrance canopy -->
  <rect x="232" y="460" width="136" height="10" rx="3" fill="#C9A227" opacity="0.85"/>
  <rect x="264" y="470" width="56" height="20" rx="3" fill="#C9A227" opacity="0.6"/>
  <!-- Pool -->
  <rect x="470" y="430" width="260" height="90" rx="14" fill="#2E6E7E" opacity="0.8"/>
  <rect x="470" y="430" width="260" height="90" rx="14" fill="none" stroke="#C9A227" stroke-width="3"/>
  <path d="M490 470 Q520 458 550 470 T610 470 T670 470" stroke="#7FD1C8" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M490 492 Q530 480 570 492 T650 492" stroke="#7FD1C8" stroke-width="2" opacity="0.35" fill="none"/>
  <!-- Lounge chairs -->
  <rect x="492" y="444" width="44" height="12" rx="4" fill="#E3C565" opacity="0.8"/>
  <rect x="548" y="444" width="44" height="12" rx="4" fill="#E3C565" opacity="0.8"/>
  <!-- Palm -->
  <g>
    <rect x="108" y="330" width="8" height="160" rx="4" fill="#0A3527"/>
    <g fill="#13674A">
      <path d="M112 330 C84 300 66 280 44 302 C68 310 84 322 98 336 Z"/>
      <path d="M112 330 C142 302 162 284 184 304 C160 314 142 326 128 336 Z"/>
      <path d="M112 330 C96 310 88 292 92 272 C104 292 110 308 120 328 Z"/>
    </g>
  </g>
  <!-- Ground -->
  <rect x="0" y="490" width="800" height="110" fill="#0A3527" opacity="0.9"/>
  <line x1="0" y1="536" x2="800" y2="536" stroke="#C9A227" stroke-width="2" opacity="0.25" stroke-dasharray="30 24"/>
  <!-- BUILDING VIEW label -->
  <rect x="30" y="520" width="230" height="50" rx="4" fill="#C9A227" opacity="0.9"/>
  <text x="145" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#06281E">BUILDING VIEW</text>
</svg>
