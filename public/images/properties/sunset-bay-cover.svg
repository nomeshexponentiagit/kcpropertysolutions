  <!-- Label -->
  <rect x="30" y="520" width="200" height="50" rx="4" fill="#C9A227" opacity="0.85"/>
  <text x="130" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#06281E">LUXURY VILLA</text>
