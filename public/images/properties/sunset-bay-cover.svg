    <path d="M180 250 L340 180 L500 250Z" fill="#06281E"/>
    <rect x="220" y="300" width="40" height="60" rx="20"/>
    <rect x="300" y="300" width="40" height="60" rx="20"/>
    <rect x="400" y="300" width="40" height="60" rx="20"/>
    <rect x="500" y="300" width="80" height="150" rx="2"/>
