<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E4A3A"/>
      <stop offset="55%" stop-color="#1F7A5C"/>
      <stop offset="100%" stop-color="#3FA378"/>
    </linearGradient>
    <linearGradient id="thatch" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E4BC5E"/>
      <stop offset="100%" stop-color="#B98A2F"/>
    </linearGradient>
    <g id="palmL">
      <path d="M0 0 C 4 45 -6 90 2 130" stroke="#08311F" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M0 0 C -12 -22 -36 -40 -60 -40 C -46 -18 -22 -8 0 0 Z" fill="#08311F"/>
      <path d="M0 0 C 2 -24 10 -46 28 -56 C 20 -32 8 -14 0 0 Z" fill="#08311F"/>
      <path d="M0 0 C 14 -20 34 -34 58 -28 C 38 -12 18 -6 0 0 Z" fill="#08311F"/>
      <path d="M0 0 C -8 -18 -18 -32 -26 -48 C -4 -34 4 -16 0 0 Z" fill="#08311F"/>
      <path d="M0 0 C 10 -14 20 -22 30 -26 C 22 -8 10 -2 0 0 Z" fill="#08311F"/>
    </g>
    <g id="cotF">
      <rect x="-40" y="0" width="80" height="62" rx="5" fill="#08311F"/>
      <path d="M-52 0 L0 -34 L52 0 Q0 9 -52 0 Z" fill="url(#thatch)"/>
      <path d="M-52 0 Q0 14 52 0 L52 0 L-52 0 Z" fill="#7A5A1C" opacity="0.55"/>
      <rect x="-13" y="34" width="26" height="28" rx="13" fill="#E4BC5E"/>
      <circle cx="-24" cy="22" r="8" fill="#3FA378"/>
      <circle cx="24" cy="22" r="8" fill="#3FA378"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- Rear tree line -->
  <path d="M0 250 Q 120 220 260 245 T 560 238 T 800 250 L 800 600 L 0 600 Z" fill="#0B3D2C" opacity="0.5"/>
  <!-- Ground -->
  <rect x="0" y="420" width="800" height="180" fill="#0B3D2C" opacity="0.75"/>
  <path d="M0 420 Q 200 405 400 418 T 800 414" stroke="#2E8B67" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Cottage row -->
  <use href="#cotF" transform="translate(95 340) scale(1.1)"/>
  <use href="#cotF" transform="translate(270 328) scale(1.25)"/>
  <use href="#cotF" transform="translate(455 348) scale(1.05)"/>
  <use href="#cotF" transform="translate(615 330) scale(1.2)"/>
  <use href="#cotF" transform="translate(745 352) scale(0.9)"/>
  <!-- Hammock between cottages -->
  <path d="M342 430 Q 398 478 452 430" stroke="#E4BC5E" stroke-width="4" fill="none"/>
  <path d="M342 430 L 335 398 M452 430 L 459 398" stroke="#7A5A1C" stroke-width="3"/>
  <!-- Tropical plants between cottages -->
  <path d="M205 440 q -14 -30 -6 -52 q 12 22 6 52 Z" fill="#2E8B67" opacity="0.85"/>
  <path d="M215 440 q 14 -32 26 -44 q 2 26 -6 44 Z" fill="#3FA378" opacity="0.8"/>
  <path d="M560 442 q -12 -26 -4 -46 q 10 18 4 46 Z" fill="#2E8B67" opacity="0.85"/>
  <path d="M570 442 q 12 -28 22 -40 q 4 22 -4 40 Z" fill="#3FA378" opacity="0.8"/>
  <!-- Palms framing -->
  <use href="#palmL" transform="translate(48 400) scale(1.35)"/>
  <use href="#palmL" transform="translate(98 425) scale(0.85)"/>
  <use href="#palmL" transform="translate(700 398) scale(1.3)"/>
  <!-- Brass label -->
  <rect x="560" y="520" width="210" height="52" rx="4" fill="#C9A227" opacity="0.92"/>
  <text x="665" y="553" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#06281E" letter-spacing="2">COTTAGES</text>
</svg>
