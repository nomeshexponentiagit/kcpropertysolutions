<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="mlWall" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F3E9D6"/>
      <stop offset="100%" stop-color="#EAD9B8"/>
    </linearGradient>
    <linearGradient id="mlFloor" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E9D9BC"/>
      <stop offset="100%" stop-color="#D9BE8E"/>
    </linearGradient>
    <linearGradient id="mlGold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E8C766"/>
      <stop offset="55%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8F6F14"/>
    </linearGradient>
  </defs>
  <!-- Ceiling -->
  <rect width="800" height="200" fill="url(#mlWall)"/>
  <rect x="40" y="30" width="720" height="120" rx="4" fill="#EAD9B8" stroke="#C9A227" stroke-width="2" opacity="0.8"/>
  <rect x="70" y="50" width="660" height="80" rx="4" fill="#F3E9D6" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
  <!-- Chandelier -->
  <rect x="398" y="30" width="4" height="52" fill="#C9A227"/>
  <ellipse cx="400" cy="92" rx="58" ry="11" fill="none" stroke="#C9A227" stroke-width="4"/>
  <ellipse cx="400" cy="112" rx="38" ry="8" fill="none" stroke="#C9A227" stroke-width="3"/>
  <circle cx="400" cy="128" r="6" fill="#E8C766"/>
  <circle cx="400" cy="128" r="46" fill="#F7D97E" opacity="0.35"/>
  <g fill="#C9A227">
    <circle cx="348" cy="95" r="4"/><circle cx="366" cy="84" r="4"/><circle cx="386" cy="80" r="4"/>
    <circle cx="414" cy="80" r="4"/><circle cx="434" cy="84" r="4"/><circle cx="452" cy="95" r="4"/>
    <circle cx="372" cy="112" r="3.5"/><circle cx="428" cy="112" r="3.5"/>
  </g>
  <!-- Back wall -->
  <rect x="120" y="200" width="560" height="200" fill="url(#mlWall)"/>
  <!-- Paneling -->
  <g fill="none" stroke="#C9A227" stroke-width="2.5">
    <rect x="150" y="215" width="100" height="175"/>
    <rect x="262" y="215" width="100" height="175"/>
    <rect x="438" y="215" width="100" height="175"/>
    <rect x="550" y="215" width="100" height="175"/>
  </g>
  <!-- Wall art above desk -->
  <rect x="360" y="215" width="80" height="62" fill="#0B3D5C" stroke="#C9A227" stroke-width="4"/>
  <circle cx="400" cy="242" r="14" fill="#F7D97E"/>
  <rect x="366" y="248" width="68" height="23" fill="#2E6E8E"/>
  <!-- Logo plate -->
  <circle cx="400" cy="326" r="30" fill="#0B3D5C" stroke="#C9A227" stroke-width="4"/>
  <circle cx="400" cy="326" r="20" fill="none" stroke="#C9A227" stroke-width="2"/>
  <text x="400" y="331" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#C9A227">M</text>
  <!-- Columns -->
  <g>
    <rect x="140" y="112" width="36" height="22" fill="#F5EBD8" stroke="#C9A227" stroke-width="2"/>
    <rect x="148" y="134" width="20" height="292" fill="#F5EBD8" stroke="#C9A227" stroke-width="1.5"/>
    <rect x="142" y="426" width="32" height="14" fill="#F5EBD8" stroke="#C9A227" stroke-width="2"/>
    <rect x="624" y="112" width="36" height="22" fill="#F5EBD8" stroke="#C9A227" stroke-width="2"/>
    <rect x="632" y="134" width="20" height="292" fill="#F5EBD8" stroke="#C9A227" stroke-width="1.5"/>
    <rect x="626" y="426" width="32" height="14" fill="#F5EBD8" stroke="#C9A227" stroke-width="2"/>
  </g>
  <!-- Reception desk -->
  <rect x="290" y="368" width="220" height="16" rx="8" fill="#E8C766"/>
  <rect x="295" y="384" width="210" height="56" fill="#0B3D5C"/>
  <rect x="295" y="384" width="210" height="4" fill="#C9A227"/>
  <rect x="295" y="432" width="210" height="4" fill="#C9A227"/>
  <text x="400" y="421" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#C9A227">RECEPTION</text>
  <!-- Marble floor -->
  <polygon points="0,600 800,600 680,400 120,400" fill="url(#mlFloor)"/>
  <g stroke="#C9A227" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M400 400 L0 600"/>
    <path d="M400 400 L800 600"/>
    <path d="M120 400 L190 600"/><path d="M680 400 L610 600"/>
    <path d="M120 400 L400 600"/><path d="M680 400 L400 600"/>
    <line x1="0" y1="452" x2="800" y2="452"/>
    <line x1="0" y1="505" x2="800" y2="505"/>
    <line x1="0" y1="558" x2="800" y2="558"/>
  </g>
  <!-- Rug -->
  <ellipse cx="400" cy="530" rx="155" ry="34" fill="#2E6E8E" opacity="0.85"/>
  <ellipse cx="400" cy="530" rx="155" ry="34" fill="none" stroke="#C9A227" stroke-width="3"/>
  <ellipse cx="400" cy="530" rx="110" ry="22" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.6"/>
  <!-- Sofas -->
  <g>
    <rect x="180" y="470" width="130" height="52" rx="10" fill="#2E6E8E"/>
    <rect x="175" y="462" width="18" height="60" rx="6" fill="#1B5468"/>
    <rect x="297" y="462" width="18" height="60" rx="6" fill="#1B5468"/>
    <rect x="192" y="480" width="52" height="18" rx="5" fill="#4A90B0"/>
    <rect x="252" y="480" width="46" height="18" rx="5" fill="#4A90B0"/>
    <rect x="480" y="470" width="130" height="52" rx="10" fill="#2E6E8E"/>
    <rect x="475" y="462" width="18" height="60" rx="6" fill="#1B5468"/>
    <rect x="597" y="462" width="18" height="60" rx="6" fill="#1B5468"/>
    <rect x="492" y="480" width="52" height="18" rx="5" fill="#4A90B0"/>
    <rect x="552" y="480" width="46" height="18" rx="5" fill="#4A90B0"/>
  </g>
  <!-- Coffee table -->
  <ellipse cx="400" cy="550" rx="62" ry="17" fill="url(#mlGold)"/>
  <line x1="352" y1="562" x2="352" y2="580" stroke="#8F6F14" stroke-width="4"/>
  <line x1="448" y1="562" x2="448" y2="580" stroke="#8F6F14" stroke-width="4"/>
  <!-- Potted palms -->
  <g>
    <path d="M200 560 L188 540 L212 540 Z" fill="#C9A227"/>
    <g stroke="#0B5E3B" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M200 540 Q185 520 182 502 M200 540 Q200 518 205 500 M200 540 Q215 520 220 504"/>
    </g>
    <path d="M600 560 L588 540 L612 540 Z" fill="#C9A227"/>
    <g stroke="#0B5E3B" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M600 540 Q585 520 582 502 M600 540 Q600 518 605 500 M600 540 Q615 520 620 504"/>
    </g>
  </g>
  <!-- Brass label -->
  <rect x="30" y="30" width="300" height="50" rx="4" fill="#C9A227" opacity="0.9"/>
  <text x="180" y="61" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#06281E">LOBBY &amp; RECEPTION</text>
</svg>
