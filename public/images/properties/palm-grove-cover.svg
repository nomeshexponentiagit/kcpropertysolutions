<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F523C"/>
      <stop offset="50%" stop-color="#239063"/>
      <stop offset="100%" stop-color="#0B3D2E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pbg)"/>
  <!-- Plot boundary -->
  <rect x="150" y="200" width="500" height="300" fill="none" stroke="#C9A227" stroke-width="2" stroke-dasharray="15,5" opacity="0.25"/>
  <!-- Palm trees -->
  <g opacity="0.12" fill="#C9A227">
    <ellipse cx="200" cy="350" rx="3" ry="100"/>
    <ellipse cx="350" cy="320" rx="3" ry="110"/>
    <ellipse cx="600" cy="340" rx="3" ry="105"/>
    <ellipse cx="500" cy="360" rx="3" ry="95"/>
  </g>
  <!-- Compass rose -->
  <g opacity="0.15" stroke="#C9A227" stroke-width="1.5" transform="translate(650,150)">
    <line x1="0" y1="-30" x2="0" y2="30"/>
    <line x1="-30" y1="0" x2="30" y2="0"/>
    <polygon points="0,-30 5,-10 0,-15 -5,-10" fill="#C9A227"/>
    <text x="0" y="-35" text-anchor="middle" font-size="10" fill="#C9A227" font-family="sans-serif">N</text>
  </g>
  <!-- Label -->
  <rect x="30" y="520" width="180" height="50" rx="4" fill="#C9A227" opacity="0.85"/>
  <text x="120" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#06281E">RESIDENTIAL PLOT</text>
</svg>
