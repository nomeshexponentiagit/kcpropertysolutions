<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C565"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="flood" cx="0.5" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#E3C565" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E3C565" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Room shell: one-point perspective, vanishing point (400,330) -->
  <rect width="800" height="600" fill="#0D131B"/>
  <polygon points="0,0 800,0 620,180 180,180" fill="#10161E"/>
  <polygon points="0,0 180,180 180,430 0,600" fill="#141C26"/>
  <polygon points="800,0 620,180 620,430 800,600" fill="#121A24"/>
  <polygon points="0,600 800,600 620,430 180,430" fill="#171F2A"/>
  <rect x="180" y="180" width="440" height="250" fill="#1A2533"/>
  <!-- Floor tile lines -->
  <g stroke="#C9A227" stroke-width="1.5" opacity="0.14">
    <line x1="0" y1="300" x2="180" y2="300"/>
    <line x1="800" y1="300" x2="620" y2="300"/>
    <line x1="0" y1="420" x2="180" y2="375"/>
    <line x1="800" y1="420" x2="620" y2="375"/>
    <line x1="0" y1="540" x2="180" y2="405"/>
    <line x1="800" y1="540" x2="620" y2="405"/>
    <line x1="290" y1="600" x2="350" y2="430"/>
    <line x1="510" y1="600" x2="450" y2="430"/>
  </g>
  <!-- Light flood from the open front -->
  <ellipse cx="400" cy="520" rx="230" ry="55" fill="url(#flood)"/>
  <!-- Back wall shelving -->
  <g>
    <rect x="210" y="210" width="120" height="180" fill="#121A24"/>
    <g fill="#C9A227" opacity="0.45">
      <rect x="222" y="224" width="16" height="10"/>
      <rect x="244" y="224" width="16" height="10"/>
      <rect x="266" y="224" width="16" height="10"/>
      <rect x="288" y="224" width="16" height="10"/>
      <rect x="222" y="250" width="16" height="10"/>
      <rect x="244" y="250" width="16" height="10"/>
      <rect x="266" y="250" width="16" height="10"/>
      <rect x="288" y="250" width="16" height="10"/>
      <rect x="222" y="276" width="16" height="10"/>
      <rect x="244" y="276" width="16" height="10"/>
      <rect x="266" y="276" width="16" height="10"/>
      <rect x="288" y="276" width="16" height="10"/>
    </g>
    <rect x="210" y="310" width="380" height="8" fill="#C9A227" opacity="0.35"/>
    <rect x="210" y="360" width="380" height="8" fill="#C9A227" opacity="0.35"/>
    <g fill="#C9A227" opacity="0.35">
      <rect x="350" y="320" width="16" height="10"/>
      <rect x="372" y="320" width="16" height="10"/>
      <rect x="394" y="320" width="16" height="10"/>
      <rect x="350" y="372" width="16" height="10"/>
      <rect x="372" y="372" width="16" height="10"/>
      <rect x="394" y="372" width="16" height="10"/>
    </g>
  </g>
  <!-- Counter with cash register -->
  <rect x="330" y="352" width="140" height="12" fill="#0E141D"/>
  <rect x="330" y="364" width="140" height="66" fill="#1A2533"/>
  <rect x="330" y="364" width="140" height="4" fill="#C9A227" opacity="0.7"/>
  <rect x="452" y="352" width="40" height="78" fill="#1A2533"/>
  <rect x="368" y="330" width="24" height="20" fill="#0B1017" stroke="#C9A227" stroke-width="1.5"/>
  <rect x="372" y="336" width="8" height="8" fill="#E3C565" opacity="0.8"/>
  <!-- Mezzanine platform (left) -->
  <polygon points="0,215 168,215 158,250 0,268" fill="#0B1017"/>
  <rect x="0" y="205" width="168" height="10" fill="url(#gold)" opacity="0.9"/>
  <!-- Mezzanine railing -->
  <g stroke="#C9A227" stroke-width="2" opacity="0.8">
    <line x1="14" y1="205" x2="14" y2="180"/>
    <line x1="42" y1="205" x2="42" y2="180"/>
    <line x1="70" y1="205" x2="70" y2="180"/>
    <line x1="98" y1="205" x2="98" y2="180"/>
    <line x1="126" y1="205" x2="126" y2="180"/>
    <line x1="154" y1="205" x2="154" y2="180"/>
  </g>
  <line x1="0" y1="180" x2="158" y2="180" stroke="#C9A227" stroke-width="2.5"/>
  <!-- Stock boxes on mezzanine -->
  <g fill="#141C26" stroke="#C9A227" stroke-width="1.5" opacity="0.9">
    <rect x="30" y="188" width="28" height="17"/>
    <rect x="64" y="188" width="28" height="17"/>
    <rect x="98" y="188" width="28" height="17"/>
  </g>
  <!-- Ladder to mezzanine (right wall) -->
  <g stroke="#C9A227" stroke-width="2.5" opacity="0.85">
    <line x1="596" y1="300" x2="566" y2="205"/>
    <line x1="612" y1="300" x2="582" y2="205"/>
    <line x1="590" y1="280" x2="606" y2="280"/>
    <line x1="584" y1="258" x2="600" y2="258"/>
    <line x1="578" y1="236" x2="594" y2="236"/>
  </g>
  <!-- Cartons stacked near right wall -->
  <g fill="#141C26" stroke="#C9A227" stroke-width="1.5" opacity="0.9">
    <rect x="528" y="380" width="44" height="30"/>
    <rect x="576" y="396" width="38" height="26"/>
    <rect x="540" y="348" width="38" height="30"/>
  </g>
  <!-- Pendant lamps -->
  <g>
    <line x1="300" y1="0" x2="300" y2="128" stroke="#C9A227" stroke-width="1.5"/>
    <polygon points="286,128 314,128 308,146 292,146" fill="url(#gold)"/>
    <circle cx="300" cy="150" r="10" fill="#E3C565" opacity="0.55"/>
    <line x1="400" y1="0" x2="400" y2="128" stroke="#C9A227" stroke-width="1.5"/>
    <polygon points="386,128 414,128 408,146 392,146" fill="url(#gold)"/>
    <circle cx="400" cy="150" r="10" fill="#E3C565" opacity="0.55"/>
    <line x1="500" y1="0" x2="500" y2="128" stroke="#C9A227" stroke-width="1.5"/>
    <polygon points="486,128 514,128 508,146 492,146" fill="url(#gold)"/>
    <circle cx="500" cy="150" r="10" fill="#E3C565" opacity="0.55"/>
  </g>
  <!-- Customer at counter -->
  <g fill="#060A0E" opacity="0.85">
    <circle cx="404" cy="420" r="7"/><path d="M396 427 Q404 422 412 427 L411 452 L397 452Z"/>
  </g>
  <!-- Label -->
  <rect x="30" y="520" width="140" height="50" rx="4" fill="#C9A227" opacity="0.92"/>
  <text x="100" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#0B1017">INTERIOR</text>
</svg>
