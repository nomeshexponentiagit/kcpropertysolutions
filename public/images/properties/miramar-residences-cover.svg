<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="mrcbg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081F17"/>
      <stop offset="45%" stop-color="#0B3D2E"/>
      <stop offset="100%" stop-color="#C0563B" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="mrctower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E4E3C"/>
      <stop offset="100%" stop-color="#052119"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mrcbg)"/>
  <!-- Large setting sun -->
  <circle cx="560" cy="240" r="80" fill="#C9A227" opacity="0.28"/>
  <circle cx="560" cy="240" r="48" fill="#E3C565" opacity="0.5"/>
  <!-- Sea -->
  <rect x="0" y="400" width="800" height="200" fill="#0E4E63" opacity="0.5"/>
  <path d="M0 430 Q120 414 240 430 T480 430 T720 430 T800 430" stroke="#7FD1C8" stroke-width="2.5" opacity="0.4" fill="none"/>
  <path d="M0 470 Q150 452 300 470 T600 470 T800 470" stroke="#7FD1C8" stroke-width="2" opacity="0.28" fill="none"/>
  <!-- Tall tower -->
