  </g>
  <!-- Corner window strips -->
  <g fill="#C9A227" opacity="0.5">
    <rect x="312" y="110" width="20" height="26"/><rect x="344" y="110" width="20" height="26"/><rect x="376" y="110" width="20" height="26"/><rect x="408" y="110" width="20" height="26"/><rect x="440" y="110" width="20" height="26"/>
    <rect x="312" y="176" width="20" height="26"/><rect x="344" y="176" width="20" height="26"/><rect x="376" y="176" width="20" height="26"/><rect x="408" y="176" width="20" height="26"/><rect x="440" y="176" width="20" height="26"/>
    <rect x="312" y="242" width="20" height="26"/><rect x="344" y="242" width="20" height="26"/><rect x="376" y="242" width="20" height="26"/><rect x="408" y="242" width="20" height="26"/><rect x="440" y="242" width="20" height="26"/>
    <rect x="312" y="308" width="20" height="26"/><rect x="344" y="308" width="20" height="26"/><rect x="376" y="308" width="20" height="26"/><rect x="408" y="308" width="20" height="26"/><rect x="440" y="308" width="20" height="26"/>
    <rect x="312" y="374" width="20" height="26"/><rect x="344" y="374" width="20" height="26"/><rect x="376" y="374" width="20" height="26"/><rect x="408" y="374" width="20" height="26"/><rect x="440" y="374" width="20" height="26"/>
  </g>
  <!-- Penthouse terrace at top with glass rail -->
  <rect x="286" y="42" width="208" height="22" fill="#C9A227" opacity="0.8"/>
  <g stroke="#C9A227" stroke-width="2" opacity="0.9" fill="none">
    <line x1="292" y1="42" x2="292" y2="26"/>
    <line x1="320" y1="42" x2="320" y2="26"/>
    <line x1="348" y1="42" x2="348" y2="26"/>
    <line x1="376" y1="42" x2="376" y2="26"/>
    <line x1="404" y1="42" x2="404" y2="26"/>
    <line x1="432" y1="42" x2="432" y2="26"/>
    <line x1="460" y1="42" x2="460" y2="26"/>
    <line x1="488" y1="42" x2="488" y2="26"/>
  </g>
  <!-- Terrace plants -->
  <g fill="#13674A">
    <path d="M304 42 C296 26 292 14 302 4 C310 16 312 28 308 42 Z"/>
    <path d="M478 42 C486 26 490 14 480 4 C472 16 470 28 474 42 Z"/>
  </g>
  <!-- Birds -->
  <g stroke="#C9A227" stroke-width="2" opacity="0.6" fill="none">
    <path d="M120 140 Q128 132 136 140 Q144 132 152 140"/>
    <path d="M160 110 Q166 104 172 110 Q178 104 184 110"/>
  </g>
  <!-- Label -->
  <rect x="30" y="520" width="260" height="50" rx="4" fill="#C9A227" opacity="0.9"/>
  <text x="160" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#06281E">MIRAMAR RESIDENCES</text>
