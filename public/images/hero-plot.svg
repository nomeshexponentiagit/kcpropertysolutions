<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1440" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F523C"/>
      <stop offset="50%" stop-color="#0B3D2E"/>
      <stop offset="100%" stop-color="#06281E"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="800" fill="url(#bg3)"/>
  <!-- Grid pattern (land parcels) -->
  <g opacity="0.06" stroke="#C9A227" stroke-width="1" fill="none">
    <line x1="0" y1="350" x2="1440" y2="350"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="200" y1="250" x2="200" y2="550"/>
    <line x1="500" y1="200" x2="500" y2="500"/>
    <line x1="800" y1="250" x2="800" y2="550"/>
    <line x1="1100" y1="200" x2="1100" y2="500"/>
    <line x1="1300" y1="300" x2="1300" y2="550"/>
  </g>
  <!-- Palm silhouettes -->
  <g opacity="0.08" fill="#C9A227">
    <ellipse cx="300" cy="380" rx="3" ry="100"/>
    <ellipse cx="900" cy="360" rx="3" ry="120"/>
    <circle cx="650" cy="430" r="25" stroke="#C9A227" stroke-width="1" fill="none"/>
  </g>
  <rect width="1440" height="400" y="400" fill="#06281E" opacity="0.85"/>
</svg>
